<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>已买到的宝贝（演示）</title>
<!-- A stand-in for Taobao's 已买到的宝贝 page, filled with made-up orders, used only to take README screenshots. -->
<style>
  body { margin: 0; background: #f5f5f5; font: 13px/1.5 "PingFang SC", "Microsoft YaHei", "WenQuanYi Zen Hei", sans-serif; color: #333; }
  .top { background: #fff; border-bottom: 2px solid #ff5000; padding: 14px 40px; font-size: 20px; font-weight: 700; color: #ff5000; }
  .wrap { width: 980px; margin: 18px auto; }
  .toolbar { display: flex; align-items: center; gap: 12px; background: #fff; padding: 12px 16px; border-radius: 8px; }
  .toolbar h2 { margin: 0 auto 0 0; font-size: 16px; }
  .official { border: 1px solid #ddd; border-radius: 6px; padding: 3px 10px; background: #fff; }
  .official i { font-style: normal; background: #ff5000; color: #fff; border-radius: 4px; padding: 0 4px; margin-left: 4px; font-size: 11px; }
  .order { background: #fff; margin-top: 12px; border-radius: 8px; overflow: hidden; }
  .order .h { background: #fafafa; padding: 8px 16px; color: #666; display: flex; gap: 24px; }
  .order .h b { color: #333; }
  .item { display: flex; gap: 12px; padding: 12px 16px; align-items: center; }
  .item .pic { width: 64px; height: 64px; border-radius: 6px; flex: none; }
  .item .t { flex: 1; }
  .item .p { width: 120px; text-align: right; }
  .item .s { width: 120px; text-align: right; color: #ff5000; font-weight: 700; }
  ul.ant-pagination { list-style: none; display: flex; gap: 6px; justify-content: flex-end; padding: 0; margin: 16px 0; }
  ul.ant-pagination li { background: #fff; border: 1px solid #ddd; border-radius: 6px; min-width: 30px; text-align: center; }
  ul.ant-pagination li a, ul.ant-pagination li button { border: 0; background: none; padding: 4px 8px; cursor: pointer; display: block; }
</style>
</head>
<body>
<div class="top">淘宝网 · 演示页面</div>
<div class="wrap">
  <div class="toolbar"><h2>已买到的宝贝</h2><span class="official">导出订单<i>新</i></span></div>
  <div id="orders"></div>
  <ul class="ant-pagination">
    <li class="ant-pagination-item-1"><a>1</a></li>
    <li class="ant-pagination-item-2"><a>2</a></li>
    <li class="ant-pagination-next"><button>›</button></li>
  </ul>
</div>
<script>
  // Made-up demo orders; nothing here is a real order, shop or product.
  const SHOPS = ['示例文具店', '演示家居旗舰店', '样品数码专营店', '测试服饰小铺', '虚构零食铺'];
  const ITEMS = ['A5 点阵笔记本 3 本装', '收纳盒 大号', 'USB-C 数据线 1m', '纯棉短袖 T 恤', '坚果礼盒 500g', '桌面绿植（仿真）', '保温杯 450ml', '手机支架'];
  const COLORS = ['#c8f169', '#ffd6a5', '#a0c4ff', '#ffadad', '#bdb2ff', '#9bf6ff', '#fdffb6', '#caffbf'];
  const pic = (i) =>
    'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" rx="8" fill="${COLORS[i % 8]}"/><text x="32" y="40" font-size="22" text-anchor="middle" fill="#333" font-family="sans-serif">${i + 1}</text></svg>`);
  function demoPage(n) {
    const orders = [];
    for (let k = 0; k < 3; k++) {
      const seq = (n - 1) * 3 + k;
      const items = [ITEMS[seq % 8]].concat(seq % 3 === 0 ? [ITEMS[(seq + 3) % 8]] : []);
      orders.push({
        id: String(1000000000000000000 + seq * 7919),
        time: `2026-0${9 - n}-${String(28 - k * 6).padStart(2, '0')} 1${k}:2${k}:00`,
        shop: SHOPS[seq % 5],
        status: seq === 4 ? '交易关闭' : '交易成功',
        items: items.map((t, j) => ({ t, q: j + 1, p: (12.5 + seq * 3.1 + j * 7).toFixed(2), i: (seq + j) % 8 })),
      });
    }
    return orders;
  }
  function asResponse(n, orders) {
    const comps = {};
    for (const o of orders) {
      const paid = o.items.reduce((s, i) => s + i.q * i.p, 0).toFixed(2);
      comps[`shopInfo_${o.id}`] = { fields: { orderId: o.id, createTime: o.time, shopName: o.shop, tradeTitle: o.status } };
      comps[`orderPayment_${o.id}`] = { fields: { actualFee: { value: `￥${paid}` }, postFee: { value: '￥0.00' } } };
      o.items.forEach((i, j) => {
        comps[`orderItemInfo_${o.id}_${j}`] = { fields: { item: { title: i.t, quantity: String(i.q), skuText: '颜色: 演示', priceInfo: { actualTotalFee: `￥${(i.q * i.p).toFixed(2)}` }, pic: `//img.example.com/demo-${i.i}.jpg`, itemUrl: `//item.example.com/item.htm?id=${i.i}` } } };
      });
    }
    comps.pagination = { fields: { currentPage: n, hasMore: n < 2, pageSize: 3, totalNum: 6 } };
    return { api: 'mtop.taobao.order.queryboughtlistV2', data: { data: comps } };
  }
  function render(orders) {
    document.getElementById('orders').innerHTML = orders.map((o) => `
      <div class="order"><div class="h"><span>${o.time.slice(0, 10)}</span><span>订单号: ${o.id}</span><b>${o.shop}</b></div>
      ${o.items.map((i) => `<div class="item"><img class="pic" src="${pic(i.i)}"><div class="t">${i.t}</div><div class="p">￥${i.p} ×${i.q}</div><div class="s">${o.status}</div></div>`).join('')}
      </div>`).join('');
  }
  // Like the real page: load each page's orders with fetch, so the extension's page hook sees the response.
  let cur = 1;
  async function load(n) {
    const orders = demoPage(n);
    await fetch('/h5/mtop.taobao.order.queryboughtlistv2/1.0/?page=' + n, { method: 'POST', body: JSON.stringify(asResponse(n, orders)) }).then((r) => r.text());
    cur = n;
    render(orders);
    document.querySelector('.ant-pagination-next').setAttribute('aria-disabled', n >= 2 ? 'true' : 'false');
  }
  document.querySelector('.ant-pagination-item-1').onclick = () => load(1);
  document.querySelector('.ant-pagination-item-2').onclick = () => load(2);
  document.querySelector('.ant-pagination-next button').onclick = () => load(cur + 1);
  load(1);
</script>
</body>
</html>
