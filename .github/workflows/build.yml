name: Build

on:
  push:
    branches: [main]
    # Pushing a tag like v2.2.0 (matching manifest.json) publishes a GitHub Release with the extension zip
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js
      - name: Read version
        run: echo "VERSION=$(node -p "require('./manifest.json').version")" >> "$GITHUB_ENV"
      # The artifact downloads as a zip with these files at its root, ready for the Chrome Web Store
      - uses: actions/upload-artifact@v4
        with:
          name: taobao-order-export-${{ env.VERSION }}
          path: |
            manifest.json
            *.js
            _locales
            icons

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="taobao-order-export-${VERSION}.zip"
          zip -r "$zip" manifest.json *.js _locales icons
          gh release create "$GITHUB_REF_NAME" "$zip" --title "Taobao Order Export ${VERSION}" --generate-notes
